  <style>
    :root {
      --bg: #0a0d09; --dark: #111410; --accent: #7ec850;
      --text: #f0f0ec; --muted: #8a8f85; --border: #1e2219;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 100px 1.25rem 2rem;
      text-align: center;
      line-height: 1.6;
    }
    .homolog-bar {
      position: fixed; top: 0; left: 0; right: 0;
      background: #3a2e05; color: #ffd166;
      font-size: 0.72rem; font-weight: 700; text-align: center;
      padding: 0.5rem 1rem; border-bottom: 1px solid #ffd16644; z-index: 10;
    }
    .logo { font-family: 'Playfair Display', serif; font-weight: 900; font-size: 1.4rem; margin-bottom: 2rem; }
    .logo span { color: var(--accent); }
    .card {
      max-width: 480px;
      background: var(--dark);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 2.5rem 1.75rem;
    }
    .icon { font-size: 2.2rem; margin-bottom: 1rem; }
    h1 { font-family: 'Playfair Display', serif; font-size: clamp(1.4rem, 4vw, 1.9rem); margin-bottom: 0.9rem; }
    p { color: var(--muted); margin-bottom: 0.75rem; }
    .debug-box {
      display: none;
      margin-top: 2rem;
      text-align: left;
      background: var(--bg);
      border: 1px dashed var(--border);
      border-radius: 8px;
      padding: 1rem;
      font-size: 0.75rem;
      color: var(--muted);
      word-break: break-word;
    }
    .whatsapp-link {
      display: inline-block;
      margin-top: 1.5rem;
      font-size: 0.85rem;
      color: var(--accent);
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="homolog-bar">🧪 ROTA EM HOMOLOGAÇÃO — Webinar Express ainda não publicado</div>

  <div class="logo">Juris<span>Dog</span></div>

  <div class="card">
    <div class="icon">🎬</div>
    <h1>Recebemos seu cadastro!</h1>
    <p>O Webinar Express da JurisDog ainda está em fase final de preparação.</p>
    <p>Assim que estiver disponível, nossa equipe avisa você por WhatsApp.</p>
    <a class="whatsapp-link" href="https://wa.me/1152423297" target="_blank" rel="noopener">
      Prefere falar agora com a nossa equipe?
    </a>
  </div>

  <div class="debug-box" id="debugBox"></div>

  <script>
    // Painel de depuração, só visível com ?debug=1 — usado para conferir
    // se as UTMs sobreviveram ao redirecionamento vindo da página de captura
    // (critério de aceite da Seção 30 da ordem).
    var params = new URLSearchParams(window.location.search);
    if (params.get('debug') === '1') {
      var box = document.getElementById('debugBox');
      var linhas = [];
      params.forEach(function (v, k) { linhas.push(k + ' = ' + v); });
      box.innerHTML = '<strong>[debug] Parâmetros recebidos nesta rota:</strong><br>' +
        (linhas.length ? linhas.join('<br>') : '(nenhum parâmetro na URL)');
      box.style.display = 'block';
    }

    try {
      if (typeof fbq !== 'undefined') fbq('trackCustom', 'WebinarPlaceholderView', {});
      if (typeof gtag !== 'undefined') gtag('event', 'WebinarPlaceholderView', {});
    } catch (e) { /* pixel/gtag indisponível — não deve quebrar a página */ }
  </script>

</body>
